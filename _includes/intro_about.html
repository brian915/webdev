<div class="intro">
  <div class="container">
    <div class="row justify-content-start align-items-center">
      {% if page.intro_image %}
      <div class="col-12 col-md-5 col-lg-4 position-relative text-center">
        <img alt="{{ page.hero_image_alt | default: page.title }}" class="intro-image{% if page.intro_image_absolute %} intro-image-absolute{% endif %}{% if page.intro_image_hide_on_mobile %} intro-image-hide-mobile{% endif %}" src="{{ page.intro_image | relative_url }}" />
      </div>
      {% endif %}

      <div class="col-12 col-md-7 col-lg-6">
        {% if page.hero_title %}
          <h1>{{ page.hero_title }}</h1>
        {% endif %}

        {% if page.hero_text %}
          <div class="content">
            {{ page.hero_text | markdownify }}
          </div>
        {% else %}
          {{ content }}
        {% endif %}

        {% if page.show_call_box %}
          {% include cta.html show_button=true %}
        {% endif %}
      </div>
    </div>
  </div>
</div>
